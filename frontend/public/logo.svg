<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexpaper">
  <!-- In-tray with two sheets, light on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx and scripts/app-icons.mjs. -->
  <style>
    .grund { fill: #fff } .rand { stroke: #9a6a3a; stroke-opacity: .35 } .akzent { stroke: #c0661c }
    .v1 { stop-color: #d9a86c } .v2 { stop-color: #9a6a3a } .v3 { stop-color: #5e3d1d }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #15100a } .rand { stroke: #c8935a; stroke-opacity: .45 } .akzent { stroke: #eda15a }
      .v1 { stop-color: #f3dcbc } .v2 { stop-color: #c8935a } .v3 { stop-color: #8a5c2f }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect class="grund" x="16.5" y="12" width="29" height="24" rx="2.5" stroke="url(#g)" stroke-width="3" stroke-opacity=".6" transform="rotate(-7 31 24)"/>
  <rect class="grund akzent" x="19" y="16" width="26" height="22" rx="2.5" stroke-width="3.4"/>
  <path class="akzent" d="M23.5 22.5h17M23.5 28h11" stroke-width="2.8" stroke-linecap="round"/>
  <path class="grund" d="M10 35h11.5l3 5.5h15l3-5.5H54v11a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4Z" stroke="url(#g)" stroke-width="4.2" stroke-linejoin="round"/>
</svg>
